## 3. Verificación

### 3.1. El demonio escucha SSDP y el HTTP responde

```bash
sudo ss -ulnp | grep 1900
# esperado: ... 239.255.255.250:1900 ... users:(("minidlnad",...))

curl -s http://<IP-de-tu-NAS>:8200/rootDesc.xml | head -5
# esperado: ... <friendlyName>Mi_NAS_Multimedia</friendlyName> ...
```

### 3.2. Log limpio

```bash
docker logs <contenedor> --tail 15
# NO debe haber líneas "sendto ... No such device"
```

### 3.3. Descubrimiento SSDP (desde el NAS o desde cualquier PC de la red)

> El `MAN` tiene que ser EXACTAMENTE `"ssdp:discover"; ns=01`.
> MiniDLNA 1.3.x descarta cualquier otra variante
> (`Ignoring invalid SSDP M-SEARCH ... [bad MAN header ...]`).

```bash
timeout 30 python3 -c "
import socket, time
s = socket.socket(socket.AF_INET, socket.SOCK_DGRAM)
s.settimeout(9)
msg = '\r\n'.join(['M-SEARCH * HTTP/1.1','HOST: 239.255.255.250:1900','MAN: \"ssdp:discover\"; ns=01','MX: 4','ST: urn:schemas-upnp-org:device:MediaServer:1','',''])
s.sendto(msg.encode(), ('239.255.255.250', 1900))
start = time.time()
n = 0
while time.time() - start < 9:
    try:
        d, a = s.recvfrom(65535)
        n += 1
        print('RESPUESTA de', a)
    except socket.timeout:
        break
print('total respuestas:', n)
"
# esperado: RESPUESTA de ('<IP-de-tu-NAS>', ...) / total respuestas: >= 1
```

### 3.4. Cliente real

VLC: **Ver → Lista de reproducción → Red local → Universal Plug'n'Play**
→ aparece el `friendlyName` configurado.

---

## 4. Diagnóstico rápido (chuleta)

| Síntoma en el log / prueba | Causa probable | Acción |
|---|---|---|
| `sendto ... No such device` (IPs 172.16.x.x) | Sin `network_interface`: intenta multicast por puentes Docker | Fijar `MINIDLNA_NETWORK_INTERFACE=<nombre-ifz>` |
| `Ignoring SSDP M-SEARCH on other interface [IP]` | Interfaz puesta como IP (máscara /32: solo se oye a sí mismo) o cliente en otra subred | Usar el NOMBRE de la interfaz, no la IP |
| `Ignoring invalid SSDP M-SEARCH ... [bad MAN header ...]` | `MAN` malformado (el cliente o tu script) | El `MAN` debe ser `"ssdp:discover"; ns=01` |
| Ni en local responde | Demonio sordo / puerto cogido por otro proceso | `ss -ulnp \| grep 1900`, reiniciar contenedor |
| La TV lo ve pero el PC no | Normal si el PC busca mal o filtra multicast | En el PC: permitir SSDP/UPnP en el firewall; probar §3.3 |

---

## 5. Nota para clientes Linux (referencia)

- Para *descubrir* UPnP desde el PC, el firewall debe permitir el tráfico
  SSDP (p. ej. en firewalld el servicio `upnp-client`).
- Dolphin y el explorador de archivos **no** sirven para DLNA:
  usa VLC o Kodi.
