# MiniDLNA en Docker (TrueNAS) — guía de instalación desde cero

Guía genérica y compartible para levantar un servidor DLNA/UPnP con la
imagen `vladgh/minidlna` sobre TrueNAS SCALE 24.x (vale para cualquier
Docker con modo `host`: Portainer, compose clásico, etc.).

Documentación oficial de la imagen:
<https://github.com/vladgh/docker_base_images/tree/main/minidlna>

---

## 1. TrueNAS desde cero (resumen)

1. Instala TrueNAS SCALE y deja la red fija (o reserva DHCP) para el NAS.
2. Crea el pool de datos y el dataset de vídeos (p. ej. `/mnt/tu-pool/videos`).
3. Dale permiso de lectura al contenido:
   ```bash
   sudo chmod -R 755 /mnt/tu-pool/videos
   ```
4. Averigua el **nombre** de tu interfaz LAN (lo necesitarás abajo):
   ```bash
   ip -br addr
   # ejemplo de salida: enp37s0  UP  192.168.0.118/24 ...
   # el nombre es "enp37s0" (en tu equipo puede ser eth0, eno1, ...)
   ```
5. Activa SSH o usa la shell web para poder ejecutar `docker`.

---

## 2. El YAML (formato comentado, listo para usar)

```yaml
# ==============================================================================
# SERVIDOR MULTIMEDIA MINIDLNA (vladgh/minidlna)
# Versión: 2026.2 | Protocolo: DLNA/UPnP para Smart TVs y consolas
# ==============================================================================
#
# 1. INTERFAZ DE RED (lee esto primero, es lo que más falla):
#    MiniDLNA debe anunciarse SOLO por tu interfaz LAN. Sin fijarla, intenta
#    el multicast también por las interfaces virtuales de Docker (br-*) y el
#    log se llena de errores "sendto ... No such device".
#    Usa el NOMBRE de la interfaz, NO su IP: con la IP deduce máscara /32,
#    solo se oye a sí mismo e ignora al resto de la red con
#    "Ignoring SSDP M-SEARCH on other interface".
#    Averigua el nombre con:  ip -br addr
#
# 2. MODO DE RED (network_mode: host):
#    El protocolo DLNA usa "multicast" para que las TVs detecten el servidor.
#    En modo "bridge" (por defecto en Docker) la mayoría de Smart TVs NO lo
#    encontrarán. La propia imagen lo exige: el contenedor debe correr en
#    modo host para recibir los paquetes UPnP.
#    En modo host NO se define la sección "ports:" (ni está permitido):
#    el contenedor usa directamente el puerto 8200 del anfitrión.
#
# 3. CONTENIDO (volúmenes):
#    Mapea tu carpeta real de vídeos a /media. El ":ro" (solo lectura) basta:
#    MiniDLNA solo lee (su base de datos vive en /minidlna/cache).
#    Para forzar un re-escaneo si no aparecen archivos nuevos, reinicia el
#    contenedor: la base se reconstruye al arrancar.
#
# 4. ANUNCIOS (notify_interval):
#    Por defecto se anuncia cada 895 s (~15 min). Si tu TV normalmente está
#    apagada y la enciendes solo para ver algo, puede tardar en aparecer:
#    con 60 s la verá casi al momento (a costa de un poco más de tráfico).
#
# 5. COMPATIBILIDAD:
#    Verificado con TVs Samsung/LG/Sony, PS5, Xbox, VLC y Windows.
#    OJO: los gestores de archivos de Linux (p. ej. Dolphin) NO muestran
#    servidores DLNA por diseño (su "Servicios de red" solo enseña DNS-SD,
#    no UPnP/SSDP). Para DLNA usa VLC: Ver → Lista de reproducción →
#    Red local → Universal Plug'n'Play.
#
# 6. DEPURA (solo si algo falla):
#    Añade "- MINIDLNA_LOG_LEVEL=debug", redespliega, reproduce el fallo y
#    mira "docker logs". QUÍTALO después (genera mucho ruido con inotify).
#    Pistas del log: "bad MAN header" = el cliente envía un MAN malformado
#    (el único válido es MAN: "ssdp:discover"; ns=01);
#    "on other interface" = la interfaz o su máscara no cubren al cliente
#    (revisa el punto 1).
#
# 7. VARIAS CARPETAS (opcional, ver ejemplo en "environment" y "volumes"):
#    una variable MINIDLNA_MEDIA_DIR_<n> por carpeta (el sufijo se ignora).
#    Puedes prefijar el tipo: A=audio, V=vídeo, P=fotos (p. ej. V,/media).
#    Si las usas, quita o ajusta el MINIDLNA_MEDIA_DIR base para no
#    escanear dos veces lo mismo.
# ==============================================================================

name: mydlna
services:
  minidlna:
    # En TrueNAS el nombre del contenedor lo genera la plataforma
    # (tipo ix-mydlna-minidlna-1). En compose clásico puedes añadir:
    # container_name: mydlna-server
    image: vladgh/minidlna:latest
    restart: always
    network_mode: host
    environment:
      # Nombre que aparecerá en tu Smart TV / VLC
      - MINIDLNA_FRIENDLY_NAME=Mi_NAS_Multimedia
      # Directorio interno donde se escanean los archivos
      - MINIDLNA_MEDIA_DIR=/media
      # Interfaz LAN por NOMBRE (¡no IP!) — ver punto 1
      - MINIDLNA_NETWORK_INTERFACE=enp37s0
      # Anuncios cada 60 s en vez de 895 s (ver punto 4). Opcional.
      - MINIDLNA_NOTIFY_INTERVAL=60
      # VARIAS CARPETAS (opcional, ver punto 7): una línea por carpeta.
      # El sufijo (_1, _2...) se ignora; el prefijo fija el tipo (A/V/P).
      # - MINIDLNA_MEDIA_DIR_1=V,/media/videos
      # - MINIDLNA_MEDIA_DIR_2=A,/media/musica
      # - MINIDLNA_MEDIA_DIR_3=P,/media/fotos
    volumes:
      # Tu carpeta real de vídeos mapeada a /media (solo lectura basta)
      - /mnt/tu-pool/videos:/media:ro
      # Si usas el punto 7, mapea aquí cada carpeta extra (mismo orden):
      # - /mnt/tu-pool/videos:/media/videos:ro
      # - /mnt/tu-pool/musica:/media/musica:ro
      # - /mnt/tu-pool/fotos:/media/fotos:ro
      # Sincronización horaria (logs con la hora correcta)
      - /etc/localtime:/etc/localtime:ro

# NOTA: con network_mode: host no se define "ports:". MiniDLNA sirve HTTP
# en el puerto estándar 8200 del anfitrión:
#   http://<IP-de-tu-NAS>:8200/              → página de estado
#   http://<IP-de-tu-NAS>:8200/rootDesc.xml  → descriptor UPnP
```

> La imagen regenera `/etc/minidlna.conf` desde estas variables en cada
> arranque: **no edites el `.conf` dentro del contenedor**, no persiste.
> Comprueba que la variable quedó fija con:
> ```bash
> docker exec <contenedor> sh -c "grep network_interface /etc/minidlna.conf"
> # esperado: network_interface=<tu-interfaz>
> ```

