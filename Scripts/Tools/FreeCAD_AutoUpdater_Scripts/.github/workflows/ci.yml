name: ci

# Sin probar hasta el primer push (el repo aún no tiene remoto).
on: [push, pull_request]

jobs:
  shell:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: shellcheck
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq shellcheck
          shellcheck -S warning linux/*.sh mac/*.command mac/run-e2e-tests.sh tests/smoke.sh
      - name: smoke tests (sin red)
        run: ./tests/smoke.sh

  powershell:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: PSScriptAnalyzer
        shell: pwsh
        run: |
          Install-Module PSScriptAnalyzer -Force -Scope CurrentUser
          $r = Invoke-ScriptAnalyzer -Path win -Recurse -Severity Error
          $r | Format-Table -AutoSize
          if ($r) { exit 1 }
